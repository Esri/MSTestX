name: Publish MSTestX packages to NuGet.org

on:
  push:
    tags:
      - 'MSTestX.UnitTestRunner-v*'
      - 'MSTestX.TestAdapter-v*'

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  metadata:
    name: Validate release metadata
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      package_id: ${{ steps.metadata.outputs.package_id }}
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and main ancestry
        id: metadata
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          $semVer = '(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?'
          if ($env:RELEASE_REF -notmatch "^refs/tags/(?<package>MSTestX\.UnitTestRunner|MSTestX\.TestAdapter)-v(?<version>$semVer)$") {
            throw "Release ref '$($env:RELEASE_REF)' is not a supported strict SemVer package tag."
          }
          $packageId = $Matches.package
          $version = $Matches.version
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the checked-out release commit.'
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/main.' }
          git merge-base --is-ancestor $commit origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release commit '$commit' is not an ancestor of main." }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "package_id=$packageId" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "commit=$commit" -Encoding utf8

  publish:
    name: Sign and publish package
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 60
    environment: nuget-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Decode signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.BASE64_ENCODED_PFX }}
          PFX_PATH: ${{ runner.temp }}\mstestx-release.pfx
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw 'The nuget-release environment must provide BASE64_ENCODED_PFX.'
          }
          try {
            [IO.File]::WriteAllBytes($env:PFX_PATH, [Convert]::FromBase64String($env:PFX_BASE64))
          }
          catch {
            throw 'BASE64_ENCODED_PFX is not valid Base64.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MSTESTX_CERTIFICATE_PATH=$($env:PFX_PATH)" -Encoding utf8

      - name: Build signed package
        id: package
        shell: pwsh
        env:
          PACKAGE_ID: ${{ needs.metadata.outputs.package_id }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
          PACKAGE_OUTPUT: ${{ runner.temp }}\signed-package
          MSTESTX_CERTIFICATE_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSTESTX_CERTIFICATE_PASSWORD)) {
            throw 'The nuget-release environment must provide PFX_PASSWORD.'
          }
          ./eng/Build-NuGetPackage.ps1 `
            -PackageId $env:PACKAGE_ID `
            -Version $env:PACKAGE_VERSION `
            -OutputDirectory $env:PACKAGE_OUTPUT

      - name: Sign and verify packages
        shell: pwsh
        env:
          NUPKG_PATH: ${{ steps.package.outputs.nupkg_path }}
          SNUPKG_PATH: ${{ steps.package.outputs.snupkg_path }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          foreach ($package in @($env:NUPKG_PATH, $env:SNUPKG_PATH)) {
            dotnet nuget sign $package `
              --certificate-path $env:MSTESTX_CERTIFICATE_PATH `
              --certificate-password $env:PFX_PASSWORD `
              --hash-algorithm SHA256 `
              --timestamper http://timestamp.digicert.com `
              --timestamp-hash-algorithm SHA256 `
              --overwrite
            if ($LASTEXITCODE -ne 0) { throw "NuGet signing failed for '$package'." }
            dotnet nuget verify $package --all
            if ($LASTEXITCODE -ne 0) { throw "NuGet verification failed for '$package'." }
          }

      - name: Upload signed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.metadata.outputs.package_id }}-${{ needs.metadata.outputs.version }}-signed
          path: |
            ${{ steps.package.outputs.nupkg_path }}
            ${{ steps.package.outputs.snupkg_path }}
          if-no-files-found: error

      - name: Log in to NuGet.org with GitHub OIDC
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          NUPKG_PATH: ${{ steps.package.outputs.nupkg_path }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet trusted publishing did not return a temporary API key.'
          }
          dotnet nuget push $env:NUPKG_PATH `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet.org package publication failed.' }

      - name: Write success summary
        shell: pwsh
        env:
          PACKAGE_ID: ${{ needs.metadata.outputs.package_id }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          "Published ``$($env:PACKAGE_ID)`` ``$($env:PACKAGE_VERSION)`` from ``$($env:RELEASE_COMMIT)``. The package and symbols were submitted; NuGet.org validates symbols asynchronously." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        env:
          PFX_PATH: ${{ runner.temp }}\mstestx-release.pfx
        run: |
          if (Test-Path -LiteralPath $env:PFX_PATH) {
            Remove-Item -LiteralPath $env:PFX_PATH -Force
          }
